name: Build SishhinDSP (Windows + macOS)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md']
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            generator: Visual Studio 17 2022
            arch: x64
          - name: macos-universal
            os: macos-15
            generator: Xcode
            arch: universal
    steps:
      - uses: actions/checkout@v4
      - name: Verify required source files
        shell: bash
        run: |
          test -f CMakeLists.txt
          test -f Source/PluginProcessor.cpp
          test -f dist/index.html
          test -f scripts/validate-web.js
      - name: Validate embedded web interface
        run: node scripts/validate-web.js
      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '1.0.3485.44'
          $folder = "${{ github.workspace }}/webview2/Microsoft.Web.WebView2.$version"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile "$env:RUNNER_TEMP/webview2.zip"
          Expand-Archive "$env:RUNNER_TEMP/webview2.zip" -DestinationPath $folder -Force
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2"
      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel 3
      - name: Package outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/VST3,package/Standalone | Out-Null
          Copy-Item 'build/SishhinDSP_artefacts/Release/VST3/SishhinDSP.vst3' 'package/VST3/' -Recurse -Force
          Copy-Item 'build/SishhinDSP_artefacts/Release/Standalone/*.exe' 'package/Standalone/' -Force
          Compress-Archive -Path package/* -DestinationPath SishhinDSP-windows-x64.zip
      - name: Package outputs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package/VST3 package/Standalone
          cp -R build/SishhinDSP_artefacts/Release/VST3/SishhinDSP.vst3 package/VST3/
          cp -R build/SishhinDSP_artefacts/Release/Standalone/SishhinDSP.app package/Standalone/
          ditto -c -k --sequesterRsrc --keepParent package SishhinDSP-macos-universal.zip
      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: SishhinDSP-${{ matrix.name }}
          path: SishhinDSP-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30
